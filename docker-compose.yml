version: '3.8'

services:
  # ── API Security Gateway ──────────────────────────────────────────
  gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRY=1h
      - MONGO_URI=mongodb://mongo:27017/api_gateway
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_ENGINE_URL=http://ai-engine:8000
      - USER_SERVICE_URL=http://user-service:4001
      - ORDER_SERVICE_URL=http://order-service:4002
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - ALERT_THROTTLE_MS=60000
    depends_on:
      - redis
      - mongo
      - ai-engine
      - user-service
      - order-service
    networks:
      - gateway-net
    restart: unless-stopped

  # ── AI Threat Analysis Engine ─────────────────────────────────────
  ai-engine:
    build: ./ai-engine
    container_name: ai-engine
    ports:
      - "8000:8000"
    networks:
      - gateway-net
    restart: unless-stopped

  # ── Dummy Microservices ───────────────────────────────────────────
  user-service:
    build: ./microservices/user-service
    container_name: user-service
    ports:
      - "4001:4001"
    networks:
      - gateway-net
    restart: unless-stopped

  order-service:
    build: ./microservices/order-service
    container_name: order-service
    ports:
      - "4002:4002"
    networks:
      - gateway-net
    restart: unless-stopped

  # ── Infrastructure ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gateway-net
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: gateway-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - gateway-net
    restart: unless-stopped

  # ── Observability ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: gateway-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - gateway-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: gateway-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gateway-net
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
  prometheus-data:
  grafana-data:

networks:
  gateway-net:
    driver: bridge
